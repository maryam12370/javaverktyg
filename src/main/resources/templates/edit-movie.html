<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Movie</title>
</head>
<body>

<h1>Edit Movie</h1>

<form th:action="@{/movies/{id}(id=${movie.id})}"
      th:object="${movie}"
      method="post">

    <input type="hidden" name="_method" value="put">

    <label>Title:</label>
    <input type="text" th:field="*{title}" required>
    <br><br>

    <label>Genre:</label>
    <input type="text" th:field="*{genre}" required>
    <br><br>

    <label>Release Year:</label>
    <input type="number" th:field="*{releaseYear}" required>
    <br><br>

    <label>Rating:</label>
    <input type="number"
           step="0.1"
           min="0"
           max="10"
           th:field="*{rating}"
           required>
    <br><br>

    <button type="submit">Update Movie</button>

</form>

<br>

<a th:href="@{/movies}">Back to Movies</a>

</body>
</html>
